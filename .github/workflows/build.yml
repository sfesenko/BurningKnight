name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}

      - name: Build Debug
        run: dotnet build Desktop/Desktop.csproj -c Debug

      - name: Build Release
        run: dotnet build Desktop/Desktop.csproj -c Release

      # ADR-0003: a release build compiles the overlay out, so nothing may ship it.
      - name: Release ships no ImGui
        run: |
          test ! -e Desktop/bin/Release/net10.0/ImGui.NET.dll
          ! find Desktop/bin/Release/net10.0/runtimes -iname '*cimgui*' | grep -q .
